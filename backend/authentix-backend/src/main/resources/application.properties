spring.application.name=authentix-backend
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Database
# ==========================================
# Prefer the real Neon/Postgres configuration when it is available, but fall back to
# an in-memory H2 database so the app can still boot in local/test environments.
spring.datasource.url=${DB_URL:jdbc:h2:mem:authentix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================
server.port=8080

# Blockchain
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

# ==========================================
# Security / JWT
# ==========================================
jwt.secret=${JWT_SECRET:authentix-development-jwt-secret-key-32bytes-min-change-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
